[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "torn-sdk"
version = "0.0.2"
description = "Torn sdk for python"
authors = [
    { name = "Santiago Rincón", email = "rincorpes@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<4.0"
dependencies = [
    "tornapiwrapper~=2.16.0",
    "pydantic",
    "onomasticon",
    "rincorpes-limen~=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.3",
    "pytest-cov~=6.0",
    "black~=26.3.1",
    "isort~=5.13",
    "mypy~=1.5",
    "pylint~=3.3",
    "pylint-per-file-ignores"
]
docs = [
    "furo~=2024.8",
    "myst-parser~=3.0",
    "sphinx~=7.4",
    "sphinx-copybutton~=0.5",
    "sphinx-design~=0.6",
    "tomli~=2.0; python_version < '3.11'",
]

[project.scripts]
torn-sdk = "torn_sdk.cli:main"

[tool.poetry]
packages = [{ include = "torn_sdk", from = "src" }]

[tool.black]
line-length = 79
target-version = ["py310"]
force-exclude = '''(
^\.venv
|^venv
|^env
|^\.env
|^build
|^dist
|^docs
|^src/torn_sdk/client\.py$
|^src/torn_sdk/client_async\.py$
|^src/torn_sdk/models/
|^src/torn_sdk/resources/_generated/
|^src/torn_sdk/resources/__init__\.py$
)'''

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["src/torn_sdk"]
known_first_party = [
    "torn_sdk",
]
skip = [".venv", "venv", "env", "build", "dist", "docs"]
skip_glob = [
    "src/torn_sdk/client.py",
    "src/torn_sdk/client_async.py",
    "src/torn_sdk/models/**",
    "src/torn_sdk/resources/_generated/**",
    "src/torn_sdk/resources/__init__.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --color=yes"

[tool.mypy]
python_version = "3.10"
files = ["src/torn_sdk"]
packages = ["torn_sdk"]
ignore_missing_imports = true
strict = false

[tool.pylint.messages_control]
disable = [
    # Justification: Classes with few public methods are common, specially interfaces,
    # data containers and base classes.
    "too-few-public-methods",
    # Justification: f-strings are preferred for logging.
    "logging-fstring-interpolation",
    # Justification: Broad exceptions are sometimes necessary for simplicity.
    "broad-exception-caught",
    # Justification: TODOs are acceptable during development.
    "fixme",
    # Justification: The only place we have duplicate code at the moment is the codegen module
    # which is in development so we will accept it for now.
    "duplicate-code"
]
per-file-ignores = [
    # Justification: Codegen module is still in development
    "src/torn_sdk/codegen/*.py:too-many-arguments,pointless-string-statement,too-many-instance-attributes,too-many-branches,too-many-return-statements,protected-access,too-many-statements,too-many-locals,unused-argument,too-many-positional-arguments,too-many-lines,import-outside-toplevel,redefined-outer-name,unsupported-membership-test",
    # Justification: Since this module files are generated by the codegen module,
    # we should first finish it before making changes here.
    "src/torn_sdk/models/*/*.py:line-too-long,unused-import,unnecessary-pass",
]

[tool.pylint.MAIN]
load-plugins = ["pylint_per_file_ignores"]
ignore-paths = [
    "^\\.venv",
    "^venv",
    "^tests",
    "^env",
    "^build",
    "^dist",
    "^docs",
]
