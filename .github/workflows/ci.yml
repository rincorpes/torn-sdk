name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-sdk:
    name: Verify generated SDK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify generated SDK artifacts
        run: |
          torn-sdk generate sdk \
            --openapi openapi.json \
            --sdk-root src/torn_sdk \
            --check

  python-package:
    uses: rincorpes/rincorpes-workflows/.github/workflows/python-package-ci.yml@main
    with:
      project_name: torn-sdk
      lint_path: src/torn_sdk
      run_mypy: true
      python_versions: '["3.13", "3.14"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      DISCORD_WEBHOOK_URL_CI: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
